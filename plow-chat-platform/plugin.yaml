name: plow-chat-platform
label: Plow
kind: platform
version: 2.1.0
description: >
  Plow gateway adapters for Hermes Agent. Registers two Hermes platforms on
  one credential: plow_chat, the agent's phone line, and plow_email, the
  agent's own email line. Both are backed by the Plow Chat REST API and share
  the transport helpers, each holding its own granted-scope WebSocket stream:
  chat membership comes from the credential's grants, not client-side
  configuration.
author: Plow / Hermes Agent seed
capabilities:
  - gateway.platform_actions
requires_env:
  - name: PLOW_AGENT_TOKEN
    description: "Line-scoped agent bearer token minted by Plow"
    prompt: "Plow agent token"
    secret: true
    password: true
  - name: PLOW_HOME_CHANNEL
    description: "Home chat uid (cht_...) used for cron and default delivery; must be a phone-line chat"
    prompt: "Home chat uid"
    secret: false
    password: false
optional_env:
  - name: PLOW_API_BASE
    description: "API base URL (default: https://api.plow.co)"
    prompt: "Plow API base URL"
    secret: false
    password: false
  - name: PLOW_MCP_URL
    description: "Mac relay MCP URL; plow-init exports it when the account has a Mac. When set, the plugin adds the Latch routing section to the system prompt"
    prompt: "Plow Mac relay URL"
    secret: false
    password: false
  - name: PLOW_WIKI_EMBED_URL
    description: "Ollama base URL that embeds the owner's wiki for recall (e.g. http://<ollama-host>:11434). With PLOW_MCP_URL set, turns in the owner's DM and trusted rooms carry the nearest wiki facts"
    prompt: "Wiki embedding server URL"
    secret: false
    password: false
  - name: WIKI_WRITER
    description: "This agent's writer name in the wiki's wiki.toml; wiki recall reaches shared roots plus the roots this agent writes. Unset: shared roots only"
    prompt: "This agent's wiki writer name"
    secret: false
    password: false
